<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | 3D ULPIN</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf4fb,#f8fafc);font-family:Arial,sans-serif;color:#17324d;padding:20px}
    .card{width:min(100%,420px);background:#fff;border:1px solid #dce6f0;border-radius:18px;padding:32px;box-shadow:0 16px 48px rgba(24,55,88,.12)}
    .mark{width:54px;height:54px;border-radius:14px;background:#e5efff;color:#245da8;display:grid;place-items:center;font-size:26px;font-weight:700;margin-bottom:20px}
    h1{font-size:23px;line-height:1.3;margin:0 0 8px}p{color:#607286;font-size:14px;line-height:1.5;margin:0 0 24px}
    label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:12px 13px;border:1px solid #cbd7e4;border-radius:9px;font-size:15px;outline:none}input:focus{border-color:#3979c6;box-shadow:0 0 0 3px #e5efff}
    button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:13px;background:#245da8;color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:hover{background:#1b4c8b}.error{background:#fff0ef;border:1px solid #ffd0cc;color:#a52b24;border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 12px}
    .foot{margin-top:20px;text-align:center;font-size:12px;color:#7a8998}
  </style>
</head>
<body><main class="card">
  <div class="mark">3D</div>
  <h1>3D ULPIN Generation &amp; Vertical Property Mapping</h1>
  <p>Sign in with the demo credentials provided to you.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="off">
    <label for="uid">User ID</label><input id="uid" name="uid" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Login</button>
  </form>
  <div class="foot">Prototype demonstration system</div>
</main></body></html>
